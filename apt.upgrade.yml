---
# ============================================================
# Ansible Playbook: APT Upgrade - Online Hosts Only
# Designed for Semaphore
#
# Behavior:
#   1. Test connectivity to every inventory host
#   2. Skip unreachable hosts
#   3. Update APT repositories on reachable hosts
#   4. Perform distribution upgrade
#   5. Remove unused dependencies
#   6. Clean APT cache
#   7. Report reboot requirement
#
# No fact gathering is required.
# ============================================================

- name: APT Maintenance - Online Hosts Only
  hosts: all
  gather_facts: false
  become: true
  ignore_unreachable: true

  tasks:

    # ========================================================
    # CONNECTIVITY CHECK
    # ========================================================

    - name: Check host connectivity
      ansible.builtin.wait_for_connection:
        timeout: 10
        connect_timeout: 5
        sleep: 1
      register: conn_check
      ignore_errors: true
      become: false

    - name: Report online host
      ansible.builtin.debug:
        msg: "ONLINE - {{ inventory_hostname }} is reachable and will be processed."
      when: conn_check is succeeded

    - name: Report offline host
      ansible.builtin.debug:
        msg: "OFFLINE - {{ inventory_hostname }} is unreachable and will be skipped."
      when: conn_check is failed


    # ========================================================
    # APT UPDATE
    # ========================================================

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        force_apt_get: true
        dpkg_options:
          - force-confold
          - force-confdef
      register: apt_update
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: conn_check is succeeded


    # ========================================================
    # APT DISTRIBUTION UPGRADE
    # ========================================================

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: yes
        force_apt_get: true
        dpkg_options:
          - force-confold
          - force-confdef
      register: apt_upgrade
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: conn_check is succeeded


    # ========================================================
    # AUTOREMOVE
    # ========================================================

    - name: Remove unused dependencies
      ansible.builtin.apt:
        autoremove: true
        purge: false
        force_apt_get: true
      register: apt_autoremove
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: conn_check is succeeded


    # ========================================================
    # AUTOCLEAN
    # ========================================================

    - name: Clean APT package cache
      ansible.builtin.apt:
        autoclean: true
        force_apt_get: true
      register: apt_clean
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: conn_check is succeeded


    # ========================================================
    # REBOOT REQUIRED CHECK
    # ========================================================

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      when: conn_check is succeeded


    # ========================================================
    # RESULTS
    # ========================================================

    - name: Display APT maintenance results
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "APT MAINTENANCE COMPLETE"
          - "Host: {{ inventory_hostname }}"
          - "APT Cache Updated: {{ apt_update.changed | default(false) }}"
          - "Packages Upgraded: {{ apt_upgrade.changed | default(false) }}"
          - "Packages Removed: {{ apt_autoremove.changed | default(false) }}"
          - "APT Cache Cleaned: {{ apt_clean.changed | default(false) }}"
          - "Reboot Required: {{ reboot_required.stat.exists | default(false) }}"
          - "=============================================="
      when: conn_check is succeeded
