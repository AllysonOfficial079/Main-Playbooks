---
- name: Homelab Pre-Maintenance Health Check
  hosts: all
  become: true
  ignore_unreachable: true
  gather_facts: true
  gather_subset:
    - min
    - distribution

  tasks:
    - name: Capture target host list for reporting
      ansible.builtin.set_fact:
        health_check_targets: "{{ ansible_play_hosts_all }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Check connectivity
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather disk usage
      ansible.builtin.command: df -h
      register: disk_usage
      changed_when: false

    - name: Check memory
      ansible.builtin.command: free -h
      register: memory_usage
      changed_when: false

    - name: Check system load
      ansible.builtin.command: uptime
      register: system_load
      changed_when: false

    - name: Check failed systemd services
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_services
      changed_when: false

    - name: Check reboot requirement (Debian/Ubuntu only)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      when: ansible_os_family == "Debian"

    - name: Normalize reboot status across OS families
      ansible.builtin.set_fact:
        reboot_status: "{{ reboot_required.stat.exists if (reboot_required.stat is defined) else 'N/A - not Debian/Ubuntu' }}"

    - name: Store report data for this host
      ansible.builtin.set_fact:
        host_report:
          hostname: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          checked_at: "{{ ansible_date_time.iso8601 }}"
          uptime: "{{ system_load.stdout }}"
          memory: "{{ memory_usage.stdout }}"
          disk: "{{ disk_usage.stdout }}"
          failed_services: "{{ failed_services.stdout | trim | default('None', true) }}"
          reboot_required: "{{ reboot_status }}"

    - name: Display health report
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "HOST: {{ host_report.hostname }}"
          - "OS: {{ host_report.os }}"
          - "KERNEL: {{ host_report.kernel }}"
          - "======================================"
          - "UPTIME:"
          - "{{ host_report.uptime }}"
          - "MEMORY:"
          - "{{ host_report.memory }}"
          - "DISK:"
          - "{{ host_report.disk }}"
          - "FAILED SERVICES:"
          - "{{ host_report.failed_services }}"
          - "REBOOT REQUIRED: {{ host_report.reboot_required }}"

- name: Build consolidated HTML health report
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    # Point this at a path that survives container restarts (a mounted volume)
    health_report_dir: /home/allyson/reports
    health_report_file: "homelab-health-check-{{ now().strftime('%Y%m%d-%H%M%S') }}.html"

  tasks:
    - name: Ensure report output directory exists
      ansible.builtin.file:
        path: "{{ health_report_dir }}"
        state: directory
        mode: "0755"

    - name: Write consolidated HTML health report
      ansible.builtin.copy:
        dest: "{{ health_report_dir }}/{{ health_report_file }}"
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>Homelab Health Check - {{ now().strftime('%Y-%m-%d %H:%M') }}</title>
          <style>
            body { font-family: Arial, Helvetica, sans-serif; background:#f4f4f4; color:#222; margin:0; padding:30px; }
            h1 { margin-bottom:4px; }
            .timestamp { color:#666; margin-bottom:30px; font-size:14px; }
            .host { background:#fff; border:1px solid #ddd; border-radius:8px; padding:18px 22px; margin-bottom:20px; }
            .host h2 { margin-top:0; border-bottom:2px solid #444; padding-bottom:6px; }
            .ok { color:#2f7a3d; font-weight:bold; }
            .warn { color:#b00020; font-weight:bold; }
            pre { background:#1e1e1e; color:#ddd; padding:12px; border-radius:6px; overflow-x:auto; font-size:13px; }
            .label { font-weight:bold; margin-top:12px; }
            .unreachable { background:#fff3f3; border:1px solid #f0b4b4; }
          </style>
          </head>
          <body>
          <h1>Homelab Pre-Maintenance Health Check</h1>
          <div class="timestamp">Report generated: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}</div>

          {% for h in health_check_targets %}
          {% if hostvars[h].host_report is defined %}
          <div class="host">
            <h2>{{ hostvars[h].host_report.hostname }}</h2>
            <div><strong>OS:</strong> {{ hostvars[h].host_report.os }} &nbsp; <strong>Kernel:</strong> {{ hostvars[h].host_report.kernel }}</div>
            <div><strong>Checked at:</strong> {{ hostvars[h].host_report.checked_at }}</div>

            <div class="label">Uptime / Load</div>
            <pre>{{ hostvars[h].host_report.uptime }}</pre>

            <div class="label">Memory</div>
            <pre>{{ hostvars[h].host_report.memory }}</pre>

            <div class="label">Disk Usage</div>
            <pre>{{ hostvars[h].host_report.disk }}</pre>

            <div class="label">Failed Services</div>
            <pre>{{ hostvars[h].host_report.failed_services }}</pre>

            <div class="label">Reboot Required:
              <span class="{{ 'warn' if hostvars[h].host_report.reboot_required == 'True' else 'ok' }}">
                {{ hostvars[h].host_report.reboot_required }}
              </span>
            </div>
          </div>
          {% else %}
          <div class="host unreachable">
            <h2>{{ h }}</h2>
            <div class="warn">UNREACHABLE or check failed — no data collected.</div>
          </div>
          {% endif %}
          {% endfor %}

          </body>
          </html>
