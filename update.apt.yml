---
# ============================================================
# APT Update - Online Hosts Only
# ============================================================

- name: Update APT on Online Hosts
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  become: true

  tasks:

    # --------------------------------------------------------
    # Check Connectivity
    # --------------------------------------------------------

    - name: Check host connectivity
      ansible.builtin.wait_for_connection:
        timeout: 10
        connect_timeout: 5
      register: conn_check
      ignore_errors: true
      become: false

    - name: Report online host
      ansible.builtin.debug:
        msg: "ONLINE - {{ inventory_hostname }} will be updated."
      when: conn_check is succeeded

    - name: Report offline host
      ansible.builtin.debug:
        msg: "OFFLINE - {{ inventory_hostname }} will be skipped."
      when: conn_check is failed

    # --------------------------------------------------------
    # APT UPDATE
    # --------------------------------------------------------

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        force_apt_get: true
        dpkg_options:
          - force-confold
          - force-confdef
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_update
      when: conn_check is succeeded

    # --------------------------------------------------------
    # RESULTS
    # --------------------------------------------------------

    - name: Display update results
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "APT UPDATE COMPLETE"
          - "Host: {{ inventory_hostname }}"
          - "Repository cache updated: {{ apt_update.changed | default(false) }}"
          - "=========================================="
      when: conn_check is succeeded
