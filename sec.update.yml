---
# ============================================================
# Ubuntu Security / System Updates
# Online Hosts Only
# ============================================================
- name: Apply Ubuntu Updates
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  become: true
  tasks:
    # --------------------------------------------------------
    # Connectivity
    # --------------------------------------------------------
    - name: Check host connectivity
      ansible.builtin.wait_for_connection:
        timeout: 10
        connect_timeout: 5
      register: conn_check
      ignore_errors: true
      become: false

    - name: Report online host
      ansible.builtin.debug:
        msg: "ONLINE - {{ inventory_hostname }} will be updated."
      when: conn_check is succeeded

    - name: Report offline host
      ansible.builtin.debug:
        msg: "OFFLINE - {{ inventory_hostname }} will be skipped."
      when: conn_check is failed

    # --------------------------------------------------------
    # Update and Upgrade
    # --------------------------------------------------------
    - name: Update APT cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        force_apt_get: true
        dpkg_options: 'force-confdef,force-confold'
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_upgrade
      when: conn_check is succeeded

    # --------------------------------------------------------
    # Check for Reboot
    # --------------------------------------------------------
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      when: conn_check is succeeded

    # --------------------------------------------------------
    # Reboot
    # --------------------------------------------------------
    - name: Reboot host if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after Ubuntu updates."
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: whoami
      when:
        - conn_check is succeeded
        - reboot_required.stat.exists

    # --------------------------------------------------------
    # Results
    # --------------------------------------------------------
    - name: Display update results
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "UPDATE COMPLETE"
          - "Host: {{ inventory_hostname }}"
          - "Packages Updated: {{ apt_upgrade.changed | default(false) }}"
          - "Reboot Required: {{ reboot_required.stat.exists | default(false) }}"
          - "=========================================="
      when: conn_check is succeeded
