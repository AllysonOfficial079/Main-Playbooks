---
- name: Homelab Pre-Maintenance Health Check
  hosts: all
  gather_facts: false
  become: true
  ignore_unreachable: true

  tasks:

    - name: Check connectivity
      ansible.builtin.wait_for_connection:
        timeout: 5

    - name: Gather disk usage
      ansible.builtin.shell: df -h
      register: disk_usage
      changed_when: false

    - name: Check memory
      ansible.builtin.shell: free -h
      register: memory_usage
      changed_when: false

    - name: Check system load
      ansible.builtin.shell: uptime
      register: system_load
      changed_when: false

    - name: Check failed systemd services
      ansible.builtin.shell: systemctl --failed --no-legend
      register: failed_services
      changed_when: false

    - name: Check reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display health report
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "HOST: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "KERNEL: {{ ansible_kernel }}"
          - "======================================"
          - "UPTIME:"
          - "{{ system_load.stdout }}"
          - "MEMORY:"
          - "{{ memory_usage.stdout }}"
          - "DISK:"
          - "{{ disk_usage.stdout }}"
          - "FAILED SERVICES:"
          - "{{ failed_services.stdout | default('None') }}"
          - "REBOOT REQUIRED: {{ reboot_required.stat.exists }}"
